spring.application.name=jobtrack

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

admin.password=${ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.info.env.enabled=true

info.app.name=JobTrack API
info.app.version=1.0
info.app.description=API REST of job tracking with JWT authentification

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=1025

mail.link =${URL_RENDER:http://localhost:8080}

file.storage.dir=${FILE_STORAGE_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB