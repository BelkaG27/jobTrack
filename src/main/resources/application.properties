spring.application.name=jobtrack

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

admin.password=${ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.info.env.enabled=true

info.app.name=JobTrack API
info.app.version=1.0
info.app.description=API REST of job tracking with JWT authentification